services:
  - type: web
    name: urban-studio-api
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate && python manage.py bootstrap_admin
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: DATABASE_URL
        fromDatabase:
          name: urban-studio-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.0

databases:
  - name: urban-studio-db
    plan: free
