services:
  - type: web
    name: urban-studio-api
    runtime: python
    buildCommand: pip install -r requirements.txt && mkdir -p media && python manage.py collectstatic --no-input && python manage.py migrate && python manage.py bootstrap_admin
    startCommand: gunicorn config.wsgi:application --workers 1 --threads 1 --timeout 300 --graceful-timeout 30 --max-requests 20 --max-requests-jitter 5
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: DATABASE_URL
        fromDatabase:
          name: urban-studio-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: CLOUDINARY_URL
        sync: false

databases:
  - name: urban-studio-db
    plan: free
