<div class="login-container">
  <div class="corner-brand">
    <img src="assets/img/logo-urban-studio.jpg" alt="Logo de Urban Studio">
  </div>

  <div class="login-card">
    
    <header class="card-header">
      <div class="card-brand">
        <img src="assets/img/logo-urban-studio.jpg" alt="Logo de Urban Studio">
        <span>urban studio</span>
      </div>
      <h2>Iniciar sesión</h2>
      <p class="subtitle">Gestión inteligente para barberías</p>
    </header>

    <form (ngSubmit)="login()" class="login-form">
      
      <div class="input-group">
        <label for="username">
          <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          Usuario
        </label>
        <input 
          type="text" 
          id="username"
          placeholder="Ingresa tu usuario" 
          [(ngModel)]="username"
          name="username"
          required
          autocomplete="username"
        >
      </div>

      <div class="input-group">
        <label for="password">
          <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          Contraseña
        </label>
        <div class="password-field">
        <input 
          [type]="mostrarContrasena ? 'text' : 'password'"
          id="password"
          placeholder="••••••••" 
          [(ngModel)]="password"
          name="password"
          required
          autocomplete="current-password"
        >
        <button
          type="button"
          class="password-toggle"
          (click)="mostrarContrasena = !mostrarContrasena"
          [attr.aria-label]="mostrarContrasena ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          [attr.aria-pressed]="mostrarContrasena"
        >
          <svg *ngIf="!mostrarContrasena" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" />
            <circle cx="12" cy="12" r="2.5" />
          </svg>
          <svg *ngIf="mostrarContrasena" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 5.2A10.7 10.7 0 0 1 12 5c6.5 0 10 7 10 7a18 18 0 0 1-3.1 3.8M6.2 6.2C3.5 8.1 2 12 2 12s3.5 7 10 7a10.7 10.7 0 0 0 3.1-.5" />
          </svg>
        </button>
        </div>
      </div>

      <div *ngIf="mensaje" class="alert-message" 
           [ngClass]="{
             'alert-success': mensaje.includes('correcto') || mensaje.includes('Entrando'), 
             'alert-error': mensaje.includes('incorrectos') || mensaje.includes('obligatorios') || mensaje.includes('completar')
           }">
        <svg class="alert-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <path d="M12 8v4M12 16h.01"/>
        </svg>

        {{ mensaje }}
      </div>
     

      <div class="actions-group">
        <button type="submit" class="btn btn-primary">
          <span>Iniciar sesión</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 18l6-6-6-6"/>
          </svg>
        </button>
        
        <button type="button" class="btn btn-secondary" (click)="irRegistro()">
          Crear cuenta
        </button>
      </div>

      <div class="divider">
        <span>Acceso seguro</span>
      </div>
      
      <p class="security-notice">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        Conexión segura • Tus datos están protegidos
      </p>

    </form>
  </div>
</div>
